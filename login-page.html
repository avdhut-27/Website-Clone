<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Adiclub Signup</title>
    <link rel="stylesheet" href="login-page.css">
</head>
<body>

<div class="overlay">
    <div class="signup-box">

        <!-- HEADER -->
        <div class="header">
            <div class="brand">
                <img src="adi.jpg" alt="adidas">
                <span>adiclub</span>
            </div>
            <a href="index.html" class="close">✕</a>
        </div>

        <!-- TITLE -->
        <h2>LOG IN OR SIGN UP</h2>
        <p class="desc">
            Enjoy members-only access to exclusive products, experiences, offers and more.
        </p>

        <!-- SOCIAL LOGIN -->
        <div class="social-login">
            <div class="social">G</div>
            <div class="social">f</div>
            <div class="social"></div>
        </div>

        <!-- EMAIL -->
        <input type="email" placeholder="EMAIL ADDRESS *">

        <!-- CHECKBOXES -->
        <label class="checkbox">
            <input type="checkbox">
            I would like to stay up to date with adidas marketing messages.
            <span>READ MORE</span>
        </label>

        <label class="checkbox">
            <input type="checkbox">
            I have read and accepted the
            <u>Terms & Conditions</u> and <u>Privacy Policy</u>.
        </label>

        <label class="checkbox">
            <input type="checkbox">
            Yes, I want to receive the latest adidas offers and product news.
            <span>READ MORE</span>
        </label>

        <label class="checkbox">
            <input type="checkbox" checked>
            Keep me logged in. <u>More info</u>
        </label>

        <!-- BUTTON -->
        <button class="continue-btn">
            CONTINUE →
        </button>

    </div>
</div>

</body>
</html>
